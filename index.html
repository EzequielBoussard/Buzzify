<!DOCTYPE html>
<html lang="es" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ButtonQuiz</title>
    <meta name="description" content="Pulsador de concurso: mantené presionado el botón y suena el buzzer.">
    <meta name="theme-color" content="#000000">

    <link rel="icon" type="image/png" sizes="96x96" href="assets/icons/favicon-96x96.png">
    <link rel="icon" type="image/svg+xml" href="assets/icons/favicon.svg">
    <link rel="shortcut icon" href="assets/icons/favicon.ico">
    <link rel="apple-touch-icon" sizes="180x180" href="assets/icons/apple-touch-icon.png">
    <link rel="manifest" href="site.webmanifest">

    <link rel="stylesheet" href="src/css/style.css">
</head>
<body>
    <nav class="navbar">
        <div class="lang-toggle" role="group" aria-label="Idioma">
            <button type="button" class="lang-btn is-active" data-lang="es" aria-pressed="true">ES</button>
            <button type="button" class="lang-btn" data-lang="en" aria-pressed="false">EN</button>
        </div>

        <button type="button" id="themeToggle" class="icon-btn" aria-label="Cambiar a tema claro"></button>

        <input type="color" id="colorPicker" value="#c0392b" aria-label="Color del botón">
    </nav>

    <header id="siteHeader">Presioná el botón para responder</header>

    <main class="stage">
        <button type="button" class="buzzer" id="buzzer" aria-label="Responder"></button>
    </main>

    <footer>
        © <a href="https://ezequiel.is-a.dev" target="_blank" rel="noopener noreferrer">Ezequiel Boussard</a> — 2025
    </footer>

    <script type="module" src="src/js/main.js"></script>
</body>
</html>
